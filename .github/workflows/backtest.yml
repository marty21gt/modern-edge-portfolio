name: Modern Edge Backtest

# Runs the daily-data pull on the GitHub runner (which CAN reach Yahoo Finance),
# then commits the CSV + JSON in data/ back into the repo so you can download them.
#
# Trigger it manually: repo -> Actions tab -> "Modern Edge Backtest" -> Run workflow.
# It also runs on the 1st of each month so your numbers stay fresh.

on:
  workflow_dispatch:            # the "Run workflow" button
  schedule:
    - cron: "0 6 1 * *"         # 06:00 UTC on the 1st of each month

permissions:
  contents: write               # lets the job commit the data files back

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "yfinance>=0.2.40" pandas numpy pandas-datareader

      - name: Generate backtest data
        run: python generate_backtest.py

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Modern Edge backtest data [skip ci]" || echo "No changes"
          git push

      - name: Upload data as artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: modern-edge-backtest-data
          path: data/
